# SeatFlow V3 Prometheus configuration.
#
# Scrapes metrics from all instrumented services running in the local
# docker-compose stack.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: seatflow-local

# Alerting rules can be added here once defined.
# rule_files:
#   - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # Prometheus self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # PostgreSQL exporter.
  - job_name: postgres
    static_configs:
      - targets: ["postgres:9187"]
        labels:
          service: postgres

  # Redis exporter.
  - job_name: redis
    static_configs:
      - targets: ["redis:9121"]
        labels:
          service: redis

  # MinIO exposes metrics on its main API port.
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
        labels:
          service: minio

  # MLflow tracking server.
  - job_name: mlflow
    static_configs:
      - targets: ["mlflow:5000"]
        labels:
          service: mlflow

  # Grafana built-in metrics endpoint.
  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana
