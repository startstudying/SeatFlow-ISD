openapi: 3.1.0
info:
  title: SeatFlow Research Engine API
  version: 3.0.0-dev
  description: 'Research Engine API for SeatFlow V3. Provides dataset construction, model

    training (base, direct, spillover, and full pipelines), evaluation

    (walk-forward and blind), backtest replay, and daily inference jobs.


    All operations are long-running; responses return a `taskId`. Clients poll

    `/tasks/{taskId}` or subscribe to the task event stream for state

    transitions. Task state transitions follow the contract documented in

    `SeatFlowError` and the `TaskStatus` schema.

    '
  contact:
    name: SeatFlow Research Team
servers:
- url: http://localhost:8000/research/v1
  description: Local development
tags:
- name: health
  description: Health and readiness probes
- name: tasks
  description: Task state queries and control
- name: datasets/build
  description: Dataset build operations
- name: datasets/validate
  description: Dataset validation operations
- name: training/base
  description: Base model training jobs
- name: training/direct
  description: Direct (single-target) training jobs
- name: training/spillover
  description: Spillover (cross-asset) training jobs
- name: training/full
  description: Full pipeline training jobs
- name: evaluation/walk-forward
  description: Walk-forward evaluation runs
- name: evaluation/blind
  description: Blind-set evaluation runs
- name: backtests
  description: Backtest replay runs
- name: inference/daily
  description: Daily inference jobs
paths:
  /health:
    get:
      tags:
      - health
      operationId: researchHealth
      summary: Liveness/readiness probe for the research engine
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '503':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /tasks:
    get:
      tags:
      - tasks
      operationId: researchListTasks
      summary: List research engine tasks
      parameters:
      - in: query
        name: status
        schema:
          $ref: '#/components/schemas/TaskStatus'
      - in: query
        name: kind
        schema:
          type: string
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '500':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /tasks/{taskId}:
    parameters:
    - $ref: '#/components/parameters/TaskId'
    get:
      tags:
      - tasks
      operationId: researchGetTask
      summary: Get task state
      responses:
        '200':
          description: Task state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskState'
        '404':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /tasks/{taskId}/cancel:
    parameters:
    - $ref: '#/components/parameters/TaskId'
    post:
      tags:
      - tasks
      operationId: researchCancelTask
      summary: Cancel a task
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskState'
        '404':
          $ref: '#/components/responses/SeatFlowErrorResponse'
        '409':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /tasks/{taskId}/events:
    parameters:
    - $ref: '#/components/parameters/TaskId'
    get:
      tags:
      - tasks
      operationId: researchStreamTaskEvents
      summary: Stream task events via Server-Sent Events
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                $ref: ../events/task-events.schema.json
        '404':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /datasets/build:
    post:
      tags:
      - datasets/build
      operationId: researchDatasetsBuild
      summary: Build a research dataset (long-running)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetBuildSpec'
      responses:
        '202':
          description: Build task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHandle'
        '400':
          $ref: '#/components/responses/SeatFlowErrorResponse'
        '409':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /datasets/build/{taskId}/preview:
    parameters:
    - $ref: '#/components/parameters/TaskId'
    get:
      tags:
      - datasets/build
      operationId: researchDatasetsBuildPreview
      summary: Get a preview of the built dataset
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetPreview'
        '404':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /datasets/validate:
    post:
      tags:
      - datasets/validate
      operationId: researchDatasetsValidate
      summary: Validate a dataset against research quality rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetValidateSpec'
      responses:
        '202':
          description: Validation task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHandle'
        '400':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /datasets/validate/{taskId}/report:
    parameters:
    - $ref: '#/components/parameters/TaskId'
    get:
      tags:
      - datasets/validate
      operationId: researchDatasetsValidateReport
      summary: Get validation report
      responses:
        '200':
          description: Validation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetValidationReport'
        '404':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /training/base:
    post:
      tags:
      - training/base
      operationId: researchTrainingBase
      summary: Train a base model (long-running)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingBaseSpec'
      responses:
        '202':
          description: Training task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHandle'
        '400':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /training/base/{taskId}/checkpoint:
    parameters:
    - $ref: '#/components/parameters/TaskId'
    get:
      tags:
      - training/base
      operationId: researchTrainingBaseCheckpoint
      summary: Get latest checkpoint metadata for a base training run
      responses:
        '200':
          description: Checkpoint metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointInfo'
        '404':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /training/direct:
    post:
      tags:
      - training/direct
      operationId: researchTrainingDirect
      summary: Train a direct (single-target) model (long-running)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingDirectSpec'
      responses:
        '202':
          description: Training task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHandle'
        '400':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /training/spillover:
    post:
      tags:
      - training/spillover
      operationId: researchTrainingSpillover
      summary: Train a spillover (cross-asset) model (long-running)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingSpilloverSpec'
      responses:
        '202':
          description: Training task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHandle'
        '400':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /training/full:
    post:
      tags:
      - training/full
      operationId: researchTrainingFull
      summary: Run the full training pipeline (long-running)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingFullSpec'
      responses:
        '202':
          description: Full training task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHandle'
        '400':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /evaluation/walk-forward:
    post:
      tags:
      - evaluation/walk-forward
      operationId: researchEvaluationWalkForward
      summary: Run a walk-forward evaluation (long-running)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalkForwardSpec'
      responses:
        '202':
          description: Evaluation task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHandle'
        '400':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /evaluation/walk-forward/{taskId}/folds:
    parameters:
    - $ref: '#/components/parameters/TaskId'
    get:
      tags:
      - evaluation/walk-forward
      operationId: researchEvaluationWalkForwardFolds
      summary: Get per-fold metrics for a walk-forward evaluation
      responses:
        '200':
          description: Fold metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkForwardFoldReport'
        '404':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /evaluation/blind:
    post:
      tags:
      - evaluation/blind
      operationId: researchEvaluationBlind
      summary: Run a blind-set evaluation (long-running)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlindSpec'
      responses:
        '202':
          description: Evaluation task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHandle'
        '400':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /evaluation/blind/{taskId}/report:
    parameters:
    - $ref: '#/components/parameters/TaskId'
    get:
      tags:
      - evaluation/blind
      operationId: researchEvaluationBlindReport
      summary: Get blind evaluation report
      responses:
        '200':
          description: Blind report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlindReport'
        '404':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /backtests:
    post:
      tags:
      - backtests
      operationId: researchBacktestsRun
      summary: Run a backtest replay (long-running)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestSpec'
      responses:
        '202':
          description: Backtest task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHandle'
        '400':
          $ref: '#/components/responses/SeatFlowErrorResponse'
    get:
      tags:
      - backtests
      operationId: researchBacktestsList
      summary: List backtests
      responses:
        '200':
          description: Backtest list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestPage'
        '500':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /backtests/{taskId}/report:
    parameters:
    - $ref: '#/components/parameters/TaskId'
    get:
      tags:
      - backtests
      operationId: researchBacktestsReport
      summary: Get backtest report
      responses:
        '200':
          description: Backtest report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestReport'
        '404':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /inference/daily:
    post:
      tags:
      - inference/daily
      operationId: researchInferenceDaily
      summary: Run a daily inference job (long-running)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyInferenceSpec'
      responses:
        '202':
          description: Inference task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHandle'
        '400':
          $ref: '#/components/responses/SeatFlowErrorResponse'
  /inference/daily/{taskId}/predictions:
    parameters:
    - $ref: '#/components/parameters/TaskId'
    get:
      tags:
      - inference/daily
      operationId: researchInferenceDailyPredictions
      summary: Get predictions produced by a daily inference job
      responses:
        '200':
          description: Predictions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyPredictionReport'
        '404':
          $ref: '#/components/responses/SeatFlowErrorResponse'
components:
  parameters:
    TaskId:
      in: path
      name: taskId
      required: true
      schema:
        type: string
  responses:
    SeatFlowErrorResponse:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SeatFlowError'
  schemas:
    SeatFlowError:
      type: object
      required:
      - code
      - message
      - traceId
      properties:
        code:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
        retryable:
          type: boolean
          default: false
        remediation:
          type: string
    HealthReport:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
          - DEGRADED
        components:
          type: object
          additionalProperties: true
    TaskHandle:
      type: object
      required:
      - taskId
      - status
      properties:
        taskId:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        acceptedAt:
          type: string
          format: date-time
        pollUrl:
          type: string
          format: uri
        streamUrl:
          type: string
          format: uri
    TaskState:
      type: object
      required:
      - taskId
      - status
      - updatedAt
      properties:
        taskId:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        progress:
          type: number
          minimum: 0
          maximum: 1
        updatedAt:
          type: string
          format: date-time
        result:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/SeatFlowError'
    TaskStatus:
      type: string
      description: "Lifecycle states. Allowed transitions:\n  REQUESTED -> QUEUED -> RUNNING -> COMPLETED\n  REQUESTED | QUEUED | RUNNING -> CANCELLED\n  RUNNING -> FAILED\n  REQUESTED | QUEUED | RUNNING\
        \ -> BLOCKED\nTerminal states (COMPLETED, CANCELLED, FAILED) must not transition further.\n"
      enum:
      - REQUESTED
      - QUEUED
      - RUNNING
      - COMPLETED
      - CANCELLED
      - FAILED
      - BLOCKED
    TaskPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskState'
    DatasetBuildSpec:
      type: object
      required:
      - datasetName
      - sourceIds
      properties:
        datasetName:
          type: string
        sourceIds:
          type: array
          items:
            type: string
        range:
          type: object
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
    DatasetPreview:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        schema:
          type: object
          additionalProperties: true
    DatasetValidateSpec:
      type: object
      required:
      - datasetId
      properties:
        datasetId:
          type: string
        qualityGateId:
          type: string
    DatasetValidationReport:
      type: object
      properties:
        passed:
          type: boolean
        failures:
          type: array
          items:
            type: object
            additionalProperties: true
    TrainingBaseSpec:
      type: object
      required:
      - datasetId
      - modelName
      properties:
        datasetId:
          type: string
        modelName:
          type: string
        config:
          type: object
          additionalProperties: true
    TrainingDirectSpec:
      type: object
      required:
      - datasetId
      - modelName
      - target
      properties:
        datasetId:
          type: string
        modelName:
          type: string
        target:
          type: string
        config:
          type: object
          additionalProperties: true
    TrainingSpilloverSpec:
      type: object
      required:
      - datasetId
      - modelName
      - sources
      properties:
        datasetId:
          type: string
        modelName:
          type: string
        sources:
          type: array
          items:
            type: string
        config:
          type: object
          additionalProperties: true
    TrainingFullSpec:
      type: object
      required:
      - datasetId
      - modelName
      properties:
        datasetId:
          type: string
        modelName:
          type: string
        config:
          type: object
          additionalProperties: true
    CheckpointInfo:
      type: object
      properties:
        path:
          type: string
        step:
          type: integer
        metrics:
          type: object
          additionalProperties: true
    WalkForwardSpec:
      type: object
      required:
      - datasetId
      - modelName
      properties:
        datasetId:
          type: string
        modelName:
          type: string
        folds:
          type: integer
        config:
          type: object
          additionalProperties: true
    WalkForwardFoldReport:
      type: object
      properties:
        folds:
          type: array
          items:
            type: object
            additionalProperties: true
    BlindSpec:
      type: object
      required:
      - datasetId
      - modelName
      properties:
        datasetId:
          type: string
        modelName:
          type: string
        config:
          type: object
          additionalProperties: true
    BlindReport:
      type: object
      properties:
        metrics:
          type: object
          additionalProperties: true
    BacktestSpec:
      type: object
      required:
      - modelId
      - datasetId
      - range
      properties:
        modelId:
          type: string
        datasetId:
          type: string
        range:
          type: object
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
    BacktestPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BacktestSummary'
    BacktestSummary:
      type: object
      properties:
        taskId:
          type: string
        modelId:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
    BacktestReport:
      type: object
      properties:
        metrics:
          type: object
          additionalProperties: true
        equityCurve:
          type: array
          items:
            type: object
            additionalProperties: true
    DailyInferenceSpec:
      type: object
      required:
      - modelId
      - tradingDay
      properties:
        modelId:
          type: string
        tradingDay:
          type: string
          format: date
    DailyPredictionReport:
      type: object
      properties:
        predictions:
          type: array
          items:
            type: object
            additionalProperties: true
