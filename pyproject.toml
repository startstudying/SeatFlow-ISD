[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seatflow"
version = "0.1.0"
description = "Dynamic heterogeneous graph research scaffold for Dragon-Tiger seat and stock flows"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SeatFlow Team" }]
dependencies = []

[project.optional-dependencies]
ml = [
  "numpy>=1.26",
  "pandas>=2.2",
  "torch>=2.2",
  "torch-geometric>=2.5",
]
tracking = [
  "mlflow>=2.14",
]
data = [
  "akshare>=1.18.64",
]
baselines = [
  "catboost>=1.2,<2",
]
api = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
seatflow = "seatflow.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["seatflow"]

[[tool.mypy.overrides]]
module = ["torch", "torch_geometric", "torch_geometric.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["seatflow.graph.tensorize", "seatflow.models.seat_hgt"]
disable_error_code = ["misc"]
