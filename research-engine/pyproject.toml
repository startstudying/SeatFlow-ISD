[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seatflow"
version = "3.0.0-dev"
description = "SeatFlow V3 Research Engine — seat-stock dynamic heterogeneous graph for Dragon-Tiger-List capital propagation and short-term return prediction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "SeatFlow Team" }]
dependencies = [
    "pydantic>=2.5,<3",
    "polars>=0.20",
    "pandas>=2.1",
    "pyarrow>=14",
    "duckdb>=0.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "torch-geometric>=2.4",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "redis>=5.0",
    "boto3>=1.34",
    "mlflow>=2.9",
    "httpx>=0.25",
    "python-jsonschema>=4.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/seatflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
