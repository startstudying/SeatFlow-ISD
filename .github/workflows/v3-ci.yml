name: SeatFlow V3 CI

on:
  push:
    branches: [rewrite/seatflow-v3]
  pull_request:
    branches: [rewrite/seatflow-v3]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Research Engine
        run: |
          python -m pip install --upgrade pip
          pip install -e "research-engine[dev]"
      - name: Run Python tests
        run: python -m pytest research-engine/tests -v

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema pyyaml openapi-spec-validator
      - name: Run contract tests
        run: python -m pytest contracts/tests -v

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('control-center/pom.xml') }}
      - name: Run Java tests
        run: mvn -f control-center/pom.xml -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: research-console/package-lock.json
      - name: Install dependencies
        run: npm --prefix research-console ci
      - name: Lint
        run: npm --prefix research-console run lint
      - name: Typecheck
        run: npm --prefix research-console run typecheck
      - name: Test
        run: npm --prefix research-console run test
      - name: Build
        run: npm --prefix research-console run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install infra test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml jsonschema
      - name: Validate Compose config
        run: |
          if command -v docker &> /dev/null; then
            docker compose -f infra/compose/docker-compose.yml config > /dev/null
          fi
      - name: Run infra tests
        run: python -m pytest infra/tests -v
