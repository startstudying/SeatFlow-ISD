[project]
name = "dt-seathgt"
seed = 42

[data]
raw_dir = "data/raw"
processed_dir = "data/processed"
lookback_days = 60
provider = "sample"
available_after_close = "18:00"

[graph]
decay_lambda = 0.10
max_edge_age_days = 20
prediction_horizons = [1, 3, 5]

[model]
hidden_dim = 128
num_heads = 4
num_layers = 2
dropout = 0.10
seat_profile_types = 4

[training]
train_start = "2021-01-01"
train_end = "2024-06-30"
valid_start = "2024-07-01"
valid_end = "2024-12-31"
test_start = "2025-01-01"
test_end = "2025-06-30"
