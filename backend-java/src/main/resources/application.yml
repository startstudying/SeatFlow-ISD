server:
  port: ${SEATFLOW_JAVA_PORT:8080}

spring:
  application:
    name: seatflow-backend-java
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SEATFLOW_DB_URL:jdbc:mysql://localhost:3306/seatflow?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SEATFLOW_DB_USERNAME:seatflow}
    password: ${SEATFLOW_DB_PASSWORD:seatflow}
  flyway:
    enabled: ${SEATFLOW_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${SEATFLOW_REDIS_HOST:localhost}
      port: ${SEATFLOW_REDIS_PORT:6379}
      password: ${SEATFLOW_REDIS_PASSWORD:}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

seatflow:
  scope: local_internal_research
  auth-mode: local-internal
  security:
    enabled: ${SEATFLOW_SECURITY_ENABLED:false}
    api-key-header: ${SEATFLOW_API_KEY_HEADER:X-SeatFlow-Api-Key}
    api-key: ${SEATFLOW_API_KEY:}
    default-actor: ${SEATFLOW_DEFAULT_ACTOR:local-internal}
    default-roles: ${SEATFLOW_DEFAULT_ROLES:ADMIN}
  encryption:
    enabled: ${SEATFLOW_ENCRYPTION_ENABLED:false}
    key-id: ${SEATFLOW_ENCRYPTION_KEY_ID:local}
    key: ${SEATFLOW_ENCRYPTION_KEY:}
  neo4j:
    enabled: ${SEATFLOW_NEO4J_ENABLED:false}
    base-url: ${SEATFLOW_NEO4J_BASE_URL:http://localhost:7474}
    username: ${SEATFLOW_NEO4J_USERNAME:neo4j}
    password: ${SEATFLOW_NEO4J_PASSWORD:}
    database: ${SEATFLOW_NEO4J_DATABASE:neo4j}
  fastapi:
    base-url: ${SEATFLOW_FASTAPI_BASE_URL:http://localhost:8000}
    connect-timeout: ${SEATFLOW_FASTAPI_CONNECT_TIMEOUT:2s}
    read-timeout: ${SEATFLOW_FASTAPI_READ_TIMEOUT:5s}
